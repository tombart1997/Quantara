# Alembic migration configuration.
# Run from the backend/ directory:  alembic upgrade head
[alembic]
script_location = alembic
# Makes the `app` package importable from alembic/env.py.
prepend_sys_path = .
# The database URL is NOT set here — env.py reads it from app.core.config
# so there is a single source of truth (.env / DATABASE_URL).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
